ks: [5, 10]
rgb_ks: [5]
configs:
  - name: fp
    kv: {mode: fp}
  - name: u8
    kv: {mode: uniform, bits: 8, group: 32}
  - name: u4
    kv: {mode: uniform, bits: 4, group: 32}
  - name: u2g32
    kv: {mode: uniform, bits: 2, group: 32}
  - name: u2g64
    kv: {mode: uniform, bits: 2, group: 64}
  - name: k4
    kv: {mode: kivi, bits: 4, group: 32, layout: kivi}
  - name: k2g32
    kv: {mode: kivi, bits: 2, group: 32, layout: kivi}
  - name: k2g64
    kv: {mode: kivi, bits: 2, group: 64, layout: kivi}
